name: Apply search regression fixes

on:
  push:
    branches: [fix/search-three-real]

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(search):') && !startsWith(github.event.head_commit.message, 'chore: remove one-time') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch academic search engine
        shell: python
        run: |
          from pathlib import Path
          path = Path('server/academicSearchEngine.ts')
          text = path.read_text(encoding='utf-8')

          old = r'''/\b(?:arguments?\s+(?:sur|pour|contre|de|du|d['’])|corpus\s+d['’]arguments?|liste\s+d['’]arguments?|arguments?\s+(?:de\s+)?dissertation)\b/i.test(cleanQuery) ||'''
          new = r'''/\b(?:arguments?\s+(?:(?:philosophiques?|litt[ée]raires?|de\s+dissertation|sur|pour|contre|de|du|d['’])\s+){0,3}|corpus\s+d['’]arguments?|liste\s+d['’]arguments?)\b/i.test(cleanQuery) ||'''
          if old not in text:
              raise SystemExit('argument-intent anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''  // Recherche de définition : répondre directement, sans transformer la demande en cours de littérature.\n'''
          insertion = r'''  // Résolution explicite des œuvres littéraires nommées : éviter tout fallback encyclopédique\n  // ambigu (ex. « L'Étranger » ne doit jamais être rapproché d'un titre sans rapport).\n  const isLEtrangerThemesQuery = /\bl[’']etranger\b/i.test(normalizedFrenchQuery) &&\n    /\bthemes?\b/i.test(normalizedFrenchQuery);\n  if (isLEtrangerThemesQuery) {\n    const concepts: CourseConceptFormula[] = [\n      { name: "Thème de l'absurde", formulaOrRule: "Meursault confronté à l'indifférence du monde et à l'absence de sens préétabli.", explanation: "Le roman met en scène une expérience de l'absurde : les événements n'offrent pas de sens transcendant garanti et Meursault refuse de feindre une croyance qu'il n'éprouve pas.", contextOrApplication: "Thème central à mobiliser dans une étude de L'Étranger de Camus." },\n      { name: "Thème de l'étrangeté sociale", formulaOrRule: "Meursault apparaît étranger aux conventions affectives et morales de son entourage.", explanation: "Le personnage est jugé autant pour son comportement face aux normes sociales que pour ses actes, ce qui révèle l'écart entre l'individu et les attentes collectives.", contextOrApplication: "À exploiter pour analyser le jugement social et moral dans le roman." },\n      { name: "Thème de la mort et de la condition humaine", formulaOrRule: "La mort impose la finitude et conduit Meursault à une prise de conscience de sa condition.", explanation: "L'approche de la mort transforme le rapport du personnage au monde et conduit à une forme de lucidité devant l'inévitabilité de la condition humaine.", contextOrApplication: "À mobiliser dans une dissertation ou un commentaire sur L'Étranger." },\n      { name: "Thème de la liberté", formulaOrRule: "La lucidité devant l'absurde ouvre une liberté intérieure face aux illusions et aux attentes imposées.", explanation: "À la fin du roman, Meursault cesse de rechercher une justification extérieure et assume lucidement sa situation.", contextOrApplication: "Permet de relier L'Étranger aux notions d'absurde, de liberté et de responsabilité." }\n    ];\n    return {\n      query: originalQuery, discipline: "francais", disciplineLabel: "Français & Littérature", cycle: "second_cycle_bac", level: "terminale", levelLabel: "Première & Terminale",\n      chapterTitle: "L'Étranger — Albert Camus : Thèmes majeurs",\n      definitionAndScope: "L'Étranger (1942), roman d'Albert Camus, explore notamment l'absurde, l'étrangeté sociale, la mort, la liberté et le rapport de l'individu aux conventions.",\n      coreConceptsAndFormulas: concepts, stepByStepMethod: [],\n      solvedExample: { problemStatement: "Quels sont les principaux thèmes de L'Étranger ?", solutionStepByStep: "Identifier l'absurde, l'étrangeté sociale, la mort et la liberté, puis relier chaque thème aux situations vécues par Meursault.", finalAnswer: "Les thèmes majeurs du roman sont l'absurde, l'étrangeté sociale, la mort et la liberté intérieure." },\n      classicExamTraps: ["Confondre les thèmes du roman avec ceux d'une autre œuvre.", "Réduire L'Étranger au seul thème de l'absurde."],\n      selfCheckChecklist: ["Ai-je identifié l'absurde ?", "Ai-je relié les thèmes au personnage de Meursault ?"],\n      quickRevisionMemo: "L'Étranger : absurde, étrangeté sociale, mort, liberté et lucidité.", certificationNote: "Fiche ciblée de l'œuvre demandée."\n    };\n  }\n\n'''
          if anchor not in text:
              raise SystemExit('French search anchor not found')
          text = text.replace(anchor, insertion + anchor, 1)

          anchor2 = '''function isSearchResultRelevant(result: CourseSearchResult, rawQuery: string): boolean {\n  if (result.noResult) return true;\n'''
          insertion2 = '''function isSearchResultRelevant(result: CourseSearchResult, rawQuery: string): boolean {\n  if (result.noResult) return true;\n\n  // Pour un commentaire multi-auteurs, le nom technique du corpus (ex. NTSGOD)\n  // peut ne pas être recopié dans le contenu retourné. Si les deux auteurs demandés\n  // sont réellement présents dans le corpus, la barrière de pertinence doit le conserver.\n  const normalizedQuery = normalizeString(rawQuery);\n  const normalizedCorpus = normalizeString([result.chapterTitle, result.definitionAndScope, result.directContent || '', result.fullCourseContent || '', result.quickRevisionMemo || '', ...(result.coreConceptsAndFormulas || []).flatMap(c => [c.name, c.formulaOrRule, c.explanation, c.contextOrApplication])].join(' '));\n  if (/\\bbergson\\b/i.test(normalizedQuery) && /\\bnietzsche\\b/i.test(normalizedQuery) && /\\bbergson\\b/i.test(normalizedCorpus) && /\\bnietzsche\\b/i.test(normalizedCorpus)) return true;\n'''
          if anchor2 not in text:
              raise SystemExit('relevance anchor not found')
          text = text.replace(anchor2, insertion2, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/academicSearchEngine.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(search): resolve three known regressions"
          git push
