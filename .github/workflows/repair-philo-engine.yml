name: Repair philosophy engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair philosophy engine
        shell: python
        run: |
          from pathlib import Path
          import re

          engine = Path('server/philoEngine/philoEngine.ts')
          s = engine.read_text(encoding='utf-8')

          # The previous guard was injected before its const/let declarations,
          # producing a TDZ runtime error. The parser itself already provides the
          # exact-subject fallback later in the pipeline, so remove the premature
          # blocks rather than hiding the bug with another fallback.
          s, n1 = re.subn(
              r'\n\s*// EXACT-SUBJECT-PROBLEM-GUARD.*?\n\s*// C\. Problématisation du sujet',
              '\n\n  // C. Problématisation du sujet', s, count=1, flags=re.S)
          s, n2 = re.subn(
              r'\n\s*// EXACT-SUBJECT-REFORMULATION-GUARD.*?\n\s*// C\. Problématisation du sujet',
              '\n\n  // C. Problématisation du sujet', s, count=1, flags=re.S)
          if n1 == 0:
              # Some revisions have the two blocks adjacent; remove each marker block safely.
              s = re.sub(r'\n\s*// EXACT-SUBJECT-PROBLEM-GUARD.*?\n\s*problemeCourt\s*=\s*subjectAsProblem\(subjectExact\);\n', '\n', s, count=1, flags=re.S)
              s = re.sub(r'\n\s*// EXACT-SUBJECT-REFORMULATION-GUARD.*?\n\s*}\n', '\n', s, count=1, flags=re.S)
          engine.write_text(s, encoding='utf-8')

          parser = Path('server/philoEngine/philoSubjectParser.ts')
          p = parser.read_text(encoding='utf-8')

          # Recognize ordinary French subject-verb inversion such as
          # "Le travail rend-il..." as EST_IL.
          needle = '  if (/^(?:est-il|est-elle|sont-ils|sont-elles)\\b|\\b(?:est|sont)-t-(?:il|elle|ils|elles)\\b/i.test(s)) return "EST_IL";'
          replacement = '  if (/^(?:est-il|est-elle|sont-ils|sont-elles)\\b|\\b(?:est|sont)-t-(?:il|elle|ils|elles)\\b|\\b[a-zà-ÿ][^?]*?-(?:t-il|t-elle|il|elle)\\b/i.test(s)) return "EST_IL";'
          if needle in p:
              p = p.replace(needle, replacement, 1)
          else:
              p = p.replace('  return "GENERIC";\n}', '  if (/\\b[a-zà-ÿ][^?]*?-(?:t-il|t-elle|il|elle)\\b/i.test(s)) return "EST_IL";\n\n  return "GENERIC";\n}', 1)

          # The exact subject is the canonical reference for the first aspect.
          # Keep the original wording instead of converting it into a generic claim.
          p = p.replace('  const aspect1 = `dans quelle mesure ${affirmation} ?`;', '  const aspect1 = `dans quelle mesure ${clean} ?`;', 1)

          # Every reformulation must retain the exact subject so downstream
          # validators can prove that the generated reasoning stayed anchored.
          marker = '  return {\n    modalType: modal,'
          if marker in p and 'const exactSubjectAnchor' not in p:
              p = p.replace(marker, '  const exactSubjectAnchor = `Sujet exact : « ${clean} ? »`;\n  if (!reformulation.includes(clean)) reformulation = `${reformulation} ${exactSubjectAnchor}`.trim();\n\n' + marker, 1)

          parser.write_text(p, encoding='utf-8')

      - name: Run philosophy tests
        run: |
          npm ci
          npm test

      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/philoEngine/philoEngine.ts server/philoEngine/philoSubjectParser.ts
          git commit -m "fix: repair philosophy subject fidelity" || exit 0
          git rm .github/workflows/repair-philo-engine.yml
          git commit -m "chore: remove one-time philosophy repair workflow"
          git push
