name: Philosophy universal repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove notion-specific problem substitution
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server/philoEngine/philoEngine.ts')
          s = p.read_text(encoding='utf-8')
          marker_a = '  // C. Problématisation du sujet\n'
          marker_b = '  // GARDE-FOU UNIVERSEL DE FIDÉLITÉ AU SUJET\n'
          start = s.find('  let problemeCourt = "";\n', s.find(marker_a))
          end = s.find(marker_b, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate philosophy problem block')

          replacement = '''  // C. PROBLÉMATISATION — SOURCE DE VÉRITÉ = SUJET EXACT\n  // Aucun mot-clé de notion ne peut fabriquer une autre question.\n  // Le parser conserve la proposition, le prédicat et la relation exacts.\n  const parsedSubjectForProblem = parseAndAnalyzePhiloSubject(subjectExact);\n  let problemeCourt = parsedSubjectForProblem.problemeCourt;\n\n'''
          s = s[:start] + replacement + s[end:]

          # The old universal override contained a special-case fallback that could\n          # still manufacture a generic philosophy question. Replace it with a strict\n          # invariant: the problem is always the canonical parsed subject.\n          old = '''  // OVERRIDE UNIVERSEL : uniquement en mode fallback générique sans correspondance fine\n  if (!matchedRelation) {\n    if (!problemeCourt || /L'homme a-t-il réellement besoin de la philosophie pour vivre \\?/i.test(problemeCourt)) {\n      problemeCourt = subjectAsProblem(subjectExact);\n    }\n  }\n'''
          if old in s:
              s = s.replace(old, '''  // INVARIANT : aucune relation/notion ne peut remplacer le sujet exact.\n  problemeCourt = parsedSubjectForProblem.problemeCourt;\n''', 1)
          else:
              # More tolerant replacement if spacing changed.
              s = re.sub(r'  // OVERRIDE UNIVERSEL[\\s\\S]*?\n  }\n\n  // Extraction du sujet direct', '  // INVARIANT : aucune relation/notion ne peut remplacer le sujet exact.\\n  problemeCourt = parsedSubjectForProblem.problemeCourt;\\n\\n  // Extraction du sujet direct', s, count=1)

          p.write_text(s, encoding='utf-8')

      - name: Add universal philosophy audit
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/philoEngine/philoUniversalAudit.test.ts')
          if not p.exists():
              p.write_text(r'''import { parseAndAnalyzePhiloSubject } from './philoSubjectParser';\n\nconst SUBJECTS = [\n  'L’art nous éloigne-t-il de la réalité ?',\n  'Le désir est-il un obstacle au bonheur ?',\n  'La liberté suppose-t-elle la conscience de soi ?',\n  'Faut-il toujours dire la vérité ?',\n  'Doit-on obéir aux lois ?',\n  'La justice est-elle compatible avec l’égalité ?',\n  'La technique nous libère-t-elle de la nature ?',\n  'Pourquoi travaillons-nous ?',\n  'Dans quelle mesure la science peut-elle atteindre la vérité ?',\n  'À quelles conditions sommes-nous libres ?',\n  'En quoi le langage permet-il de penser ?',\n  'Jusqu’à quel point peut-on connaître autrui ?',\n  'Est-ce renoncer à sa liberté que d’obéir ?',\n  'La conscience suffit-elle à définir l’homme ?',\n  'Le bonheur dépend-il de nous ?',\n  'L’histoire est-elle prévisible ?',\n  'La religion est-elle une illusion ?',\n  'L’art est-il une imitation de la réalité ?',\n  'Le travail nous rend-il libres ?',\n  'La mémoire nous empêche-t-elle de vivre dans le présent ?',\n  'La culture dénature-t-elle l’homme ?',\n  'Le temps détruit-il tout ?',\n  'Peut-on être heureux sans être libre ?',\n  'Qu’est-ce qu’une vie réussie ?',\n  'Que signifie être responsable ?',\n  'Avons-nous besoin d’autrui pour être nous-mêmes ?',\n  'La vérité est-elle toujours bonne à dire ?',\n  'La philosophie est-elle utile ?',\n  'L’État protège-t-il la liberté ?',\n  'Le droit est-il toujours juste ?',\n  'La nature doit-elle être maîtrisée ?',\n  'Peut-on vivre sans langage ?',\n  'La science peut-elle tout expliquer ?',\n  'La technique peut-elle devenir une menace ?',\n  'L’art nous fait-il mieux voir le monde ?',\n  'Le beau dépend-il du goût ?',\n  'Sommes-nous déterminés par notre inconscient ?',\n  'Peut-on être responsable de ce dont on n’a pas conscience ?',\n  'Le devoir s’oppose-t-il au bonheur ?',\n  'La liberté consiste-t-elle à faire ce que l’on veut ?',\n  'L’opinion est-elle un obstacle à la vérité ?',\n  'Peut-on démontrer toutes les vérités ?',\n  'Le progrès est-il toujours souhaitable ?',\n  'La société limite-t-elle nécessairement notre liberté ?',\n  'Autrui est-il un obstacle à ma liberté ?',\n  'La mort donne-t-elle un sens à la vie ?',\n  'L’oubli est-il une faiblesse de la mémoire ?',\n  'L’éducation nous rend-elle libres ?',\n  'L’homme est-il naturellement bon ?',\n  'La culture nous éloigne-t-elle de la nature ?',\n];\n\nfor (const subject of SUBJECTS) {\n  const parsed = parseAndAnalyzePhiloSubject(subject);\n  if (!parsed.problemeCourt.endsWith('?')) throw new Error(`Problem is not a question: ${subject}`);\n  const normalizedSubject = subject.replace(/[?？]+$/, '').trim().toLowerCase();\n  const normalizedProblem = parsed.problemeCourt.replace(/[?？]+$/, '').trim().toLowerCase();\n  if (normalizedSubject !== normalizedProblem) {\n    throw new Error(`Subject drift: ${subject} -> ${parsed.problemeCourt}`);\n  }\n  if (!parsed.reformulation.includes(subject.replace(/[?？]+$/, '').trim())) {\n    throw new Error(`Reformulation lost the exact subject: ${subject}`);\n  }\n}\n\nconsole.log(`Universal philosophy audit passed: ${SUBJECTS.length} subjects`);\n''', encoding='utf-8')

      - name: Run all tests
        run: npm test -- --runInBand

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/philoEngine/philoEngine.ts server/philoEngine/philoUniversalAudit.test.ts
          git diff --cached --quiet || git commit -m "refactor: make philosophy problem generation universal"
          git push

      - name: Remove one-time repair workflow
        shell: bash
        run: |
          git rm .github/workflows/philo-universal-repair.yml
          git commit -m "chore: remove one-time philosophy repair workflow"
          git push
